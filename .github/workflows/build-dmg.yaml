name: PSG Lotto macOS DMG Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

    # 1️⃣ Clone Bitbucket Repo (NEW REPO)
    - name: Clone Repository
      run: |
        git clone -b develop https://first40-admin:${{ secrets.BITBUCKET_PIPELINE123 }}@bitbucket.org/trirope-tech/psglotto.git

    # 2️⃣ Verify repo
    - name: Check Files
      run: |
        cd psglotto
        pwd
        ls -l

    # 3️⃣ Setup Flutter
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable

    # 4️⃣ Install dependencies
    - name: Flutter Setup
      run: |
        cd psglotto
        flutter clean
        flutter pub get

    # 5️⃣ Enable macOS support (FORCE FIX)
    - name: Enable macOS Support
      run: |
        cd psglotto
        flutter config --enable-macos-desktop
        rm -rf macos
        flutter create . --platforms=macos

    # 6️⃣ Build macOS
    - name: Build macOS
      run: |
        cd psglotto
        flutter build macos --release

    # 7️⃣ Install DMG tool
    - name: Install create-dmg
      run: brew install create-dmg

    # 8️⃣ Create DMG
    - name: Create DMG
      run: |
        cd psglotto
        APP_PATH=$(find build/macos -name "*.app" | head -n 1)

        create-dmg \
          --volname "PSGLotto" \
          "PSGLotto.dmg" \
          "$APP_PATH"

    # 9️⃣ Upload DMG
    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: macos-dmg
        path: psglotto/PSGLotto.dmg
