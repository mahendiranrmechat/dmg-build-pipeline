name: PSG Lotto macOS DMG Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:

    # ✅ 1. Checkout code from GitHub
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ✅ 2. Setup Flutter SDK
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable

    # ✅ 3. Cache Flutter dependencies (faster builds)
    - name: Cache pub packages
      uses: actions/cache@v3
      with:
        path: ~/.pub-cache
        key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

    # ✅ 4. Install dependencies
    - name: Install Dependencies
      run: |
        flutter clean
        flutter pub get

    # ✅ 5. Verify macOS support (safe check, no modification)
    - name: Verify macOS support
      run: flutter doctor -v

    # ✅ 6. Build macOS app
    - name: Build macOS
      run: flutter build macos --release

    # ✅ 7. Install DMG tool
    - name: Install create-dmg
      run: brew install create-dmg

    # ✅ 8. Create DMG file
    - name: Create DMG
      run: |
        APP_PATH=$(find build/macos -name "*.app" | head -n 1)

        echo "App path: $APP_PATH"

        create-dmg \
          --volname "PSGLotto" \
          --window-size 600 400 \
          --icon-size 100 \
          --app-drop-link 450 200 \
          "$APP_PATH" \
          "PSGLotto.dmg"

    # ✅ 9. Upload DMG artifact
    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: macos-dmg
        path: PSGLotto.dmg
