name: Flutter macOS DMG Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

    # 1️⃣ Clone Bitbucket Repository
    - name: Clone Repository
      run: |
        git clone https://first40-admin:${{ secrets.BITBUCKET_PIPELINE123 }}@bitbucket.org/trirope-tech/pinaslotto-game-client.git

    # 2️⃣ Setup Flutter
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable

    # 3️⃣ Check Flutter
    - name: Check Flutter
      run: |
        which flutter
        flutter --version

    # 4️⃣ Auto-detect Flutter project folder
    - name: Detect Flutter Project
      run: |
        cd pinaslotto-game-client
        PROJECT_DIR=$(find . -name pubspec.yaml | head -n 1 | xargs dirname)
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        echo "Detected project at $PROJECT_DIR"

    # 5️⃣ Flutter Setup
    - name: Flutter Setup
      run: |
        cd pinaslotto-game-client/${{ env.PROJECT_DIR }}
        flutter clean
        flutter pub get

    # 6️⃣ Enable macOS
    - name: Enable macOS
      run: flutter config --enable-macos-desktop

    # 7️⃣ Build macOS
    - name: Build macOS
      run: |
        cd pinaslotto-game-client/${{ env.PROJECT_DIR }}
        flutter build macos --release

    # 8️⃣ Install DMG tool
    - name: Install create-dmg
      run: brew install create-dmg

    # 9️⃣ Create DMG
    - name: Create DMG
      run: |
        cd pinaslotto-game-client/${{ env.PROJECT_DIR }}

        APP_PATH=$(find build/macos -name "*.app" | head -n 1)
        echo "App path: $APP_PATH"

        create-dmg \
          --volname "PinaSlotto" \
          "PinaSlotto.dmg" \
          "$APP_PATH"

    # 🔟 Upload DMG
    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: macos-dmg
        path: pinaslotto-game-client/${{ env.PROJECT_DIR }}/PinaSlotto.dmg
