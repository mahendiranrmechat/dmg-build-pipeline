name: PSG Lotto macOS DMG Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:

    # ✅ 1. Checkout
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ✅ 2. Setup Flutter (FORCED VERSION - NO CACHE)
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'
        cache: false

    # ✅ 3. Verify Flutter & Dart version (DEBUG - IMPORTANT)
    - name: Check Flutter Version
      run: flutter --version

    # ✅ 4. Install dependencies
    - name: Install Dependencies
      run: |
        flutter clean
        flutter pub get

    # ✅ 5. Install CocoaPods (fix macOS build issues)
    - name: Install CocoaPods
      run: |
        cd macos
        pod install
        cd ..

    # ✅ 6. Doctor check
    - name: Flutter Doctor
      run: flutter doctor -v

    # ✅ 7. Build macOS app
    - name: Build macOS
      run: flutter build macos --release

    # ✅ 8. Install DMG tool
    - name: Install create-dmg
      run: brew install create-dmg

    # ✅ 9. Create DMG
    - name: Create DMG
      run: |
        APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -n 1)

        echo "App path: $APP_PATH"

        create-dmg \
          --volname "PSGLotto" \
          --window-size 600 400 \
          --icon-size 100 \
          --app-drop-link 450 200 \
          "PSGLotto.dmg" \
          "$APP_PATH"

    # ✅ 10. Upload DMG
    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: macos-dmg
        path: PSGLotto.dmg
