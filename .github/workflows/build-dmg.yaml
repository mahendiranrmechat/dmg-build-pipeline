name: Flutter macOS DMG Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:

    # 1️⃣ Clone Bitbucket Repository
    - name: Clone Repository
      env:
        BB_TOKEN: ${{ secrets.BITBUCKET_PIPELINE123 }}
      run: |
        git clone https://first40-admin:$BB_TOKEN@bitbucket.org/trirope-tech/pinaslotto-game-client.git

    # 2️⃣ Setup Flutter
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable

    # 3️⃣ Verify Flutter
    - name: Check Flutter
      run: |
        which flutter
        flutter --version

    # 4️⃣ Prepare Project (like Jenkins script)
    - name: Flutter Setup
      run: |
        cd pinaslotto-game-client
        flutter clean
        flutter pub get

    # 5️⃣ Enable macOS support
    - name: Enable macOS
      run: flutter config --enable-macos-desktop

    # 6️⃣ Build macOS App
    - name: Build macOS
      run: |
        cd pinaslotto-game-client
        flutter build macos --release

    # 7️⃣ Install DMG tool
    - name: Install create-dmg
      run: brew install create-dmg

    # 8️⃣ Create DMG
    - name: Create DMG
      run: |
        cd pinaslotto-game-client

        APP_PATH=$(find build/macos -name "*.app" | head -n 1)
        echo "App path: $APP_PATH"

        create-dmg \
          --volname "PinaSlotto" \
          --window-size 800 400 \
          --icon-size 100 \
          --app-drop-link 600 185 \
          "PinaSlotto-${VERSION_NAME}.dmg" \
          "$APP_PATH"

    # 9️⃣ Upload DMG Artifact
    - name: Upload DMG
      uses: actions/upload-artifact@v3
      with:
        name: macos-dmg
        path: pinaslotto-game-client/PinaSlotto-*.dmg
