name: psglotto
description: PSG LOTTO

publish_to: 'none'

version: 1.1.4+1

environment:
  sdk: ">=2.16.2 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  series_2d:
    git:
      url: https://github.com/mahendiranrmechat/series_2d.git
      ref: main

  connectivity_plus: ^2.3.4
  intl: ^0.19.0
  bubble_tab_indicator: ^0.1.6
  http: ^1.2.1
  url_launcher: ^6.1.3
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.3.3
  device_info_plus: ^11.3.3
  path_provider: ^2.1.5
  timezone: ^0.10.0
  scrollable_positioned_list: ^0.3.2
  pdf: ^3.10.4
  syncfusion_flutter_barcodes: ^28.2.9
  open_file: ^3.2.1
  window_manager: ^0.4.3
  dropdown_search: ^5.0.5
  auto_size_text: ^3.0.0
  data_table_2: ^2.4.1
  another_flushbar: ^1.12.30
  universal_html: ^2.2.2
  animated_custom_dropdown: ^3.0.0
  package_info_plus: ^8.0.0
  printing: ^5.13.2
  flutter_blue_plus: ^1.27.0
  esc_pos_utils_plus: ^2.0.2
  slide_to_act: ^2.0.2
  barcode_widget: ^2.0.4
  number_paginator: ^0.4.0
  google_fonts: ^6.2.0
  shimmer: ^3.0.0
  msix: ^3.16.7
  lottie: ^3.1.0
  flutter_speed_dial: ^7.0.0
  animated_flip_counter: ^0.3.4
  process_run: ^1.2.4
  archive: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

msix_config:
  display_name: JACKPOT
  publisher_display_name: psjackpot
  identity_name: com.psglotto.jackpot.live

  # ⚠️ IMPORTANT: Use relative paths for CI/CD
  logo_path: assets/images/jackpot.png
  certificate_path: certificate/CERTIFICATE.pfx

  capabilities: internetClient, location
  certificate_password: PsJackpot!@#
